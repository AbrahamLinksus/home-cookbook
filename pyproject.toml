[project]
name = "home-cookbook"
version = "0.1.0"
description = "Home Cookbook: a recipe keeper for the home network"
requires-python = "~=3.12.0"
dependencies = [
    "flask==3.1.3",
    "waitress==3.0.2",
]

[project.scripts]
cookbook = "cookbook.app.serve:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cookbook"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C90", "PL", "RUF", "TID"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlite3".msg = "sqlite3 is only allowed in src/cookbook/adapters/"

[tool.ruff.lint.per-file-ignores]
"src/cookbook/adapters/**" = ["TID251"]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["cookbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cookbook"]

[tool.coverage.report]
fail_under = 80

[tool.importlinter]
root_package = "cookbook"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = ["cookbook.app", "cookbook.web", "cookbook.services | cookbook.adapters", "cookbook.domain"]

[[tool.importlinter.contracts]]
name = "Web never touches storage"
type = "forbidden"
source_modules = ["cookbook.web"]
forbidden_modules = ["cookbook.adapters"]

[[tool.importlinter.contracts]]
name = "No web framework below web"
type = "forbidden"
source_modules = ["cookbook.domain", "cookbook.services", "cookbook.adapters"]
forbidden_modules = ["flask", "werkzeug", "waitress"]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "import-linter>=2.5",
    "mypy>=1.18",
    "playwright==1.49.1",
    "pytest==9.2.0",
    "pytest-cov>=7.0",
    "pytest-playwright==0.10.0",
    "radon==6.0.1",
    "ruff>=0.14",
    "types-waitress>=3.0.1.20260724",
]
